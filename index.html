<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ed"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Wandering BarBack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#261810;background:#f8eee2}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.shell{max-width:600px;min-height:100dvh;margin:auto;background:linear-gradient(#fff7ed,#f9eddf);padding-bottom:105px}.header{padding:52px 24px 22px;background:linear-gradient(145deg,#fff8ef,#f1ddca)}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:700 28px/1.05 'Playfair Display',serif}.brand span{display:block;color:#aa744b;font-style:italic;font-weight:500}.actions{display:flex;align-items:center;gap:16px}.icon-button{background:none;border:0;color:#332119;font-size:25px}.avatar{background:#b17a4c;border:0;border-radius:50%;width:49px;height:49px;color:white;font-size:17px}.header h1{font:700 38px 'Playfair Display',serif;margin:31px 0 0}main{padding:20px 20px 24px}.card{background:#fffaf4;border-radius:22px;box-shadow:0 9px 24px #65412a13;overflow:hidden}.section-title{display:flex;align-items:center;justify-content:space-between;width:100%;background:#ead9c9;border:0;padding:14px 17px;font-size:20px;font-weight:800;color:#21160f}.event-content{display:flex;gap:16px;padding:17px 15px 20px}.event-image{width:36%;min-height:175px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#a47a43,#261810 75%);display:flex;align-items:center;justify-content:center;font-size:62px}.event-info{flex:1;min-width:0}.event-info h2{font-size:21px;margin:0 0 10px}.event-info .detail{display:flex;align-items:center;gap:9px;font-size:15px;margin:8px 0}.progress-line{display:flex;align-items:center;gap:10px;margin:14px 0}.track{height:9px;background:#ddc9b9;border-radius:99px;flex:1;overflow:hidden}.track span{display:block;width:75%;height:100%;background:#5b3421;border-radius:99px}.status{display:inline-block;background:#ffdda0;border-radius:99px;padding:9px 15px;font-weight:700;font-size:13px}.tasks{margin-top:29px}.tasks-heading{display:flex;justify-content:space-between;align-items:center;margin:0 7px 10px}.tasks-heading h2{font-size:25px;margin:0}.count{background:#b67f51;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:700}.task-list{padding:8px 17px}.task{display:flex;align-items:center;gap:14px;min-height:58px;border-bottom:1px solid #eaded1;font-size:16px}.task:last-child{border:0}.task input{appearance:none;border:2px solid #38251a;border-radius:5px;width:23px;height:23px;flex-shrink:0}.task input:checked{background:#5b3421;border-color:#5b3421}.task input:checked:after{content:'✓';color:white;display:block;text-align:center;font-size:17px}.task span{flex:1}.completed{text-decoration:line-through;color:#897b70}.new-event{margin-top:26px;width:100%;border:0;border-radius:20px;padding:19px;background:#4b2c1d;color:#fff;display:flex;align-items:center;justify-content:center;gap:13px;font-size:18px;font-weight:700}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,600px);padding:12px 5px calc(12px + env(safe-area-inset-bottom));background:#fff7ee;border-top:1px solid #e8d6c7;display:flex;justify-content:space-around;box-shadow:0 -4px 15px #5d392010}.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#786e65;font-size:10px;padding:3px 0;min-width:55px}.bottom-nav button.active{color:#4b2c1d;font-weight:800}.bottom-nav svg{width:25px;height:25px}.placeholder{text-align:center;padding:55px 20px}.placeholder h2{font-size:24px}.placeholder p{color:#6b5c50}.overlay{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:25px;z-index:10}.modal{background:#fff8ef;border-radius:20px;padding:24px;max-width:380px}.modal button{background:#4b2c1d;color:white;border:0;border-radius:12px;padding:12px 20px}@media(max-width:380px){.event-content{gap:10px}.event-image{min-height:160px}.event-info h2{font-size:18px}.header h1{font-size:34px}.task{font-size:14px}}
</style>
</head>
<body><div class="shell"><header class="header"><div class="top"><div class="brand">Wandering Bar<span>BarBack.</span></div><div class="actions"><button class="icon-button" aria-label="Meldingen">♧</button><button class="avatar" aria-label="Profiel">WB</button></div></div><h1 id="page-title">Dashboard</h1></header><main id="main"></main><nav class="bottom-nav" aria-label="Hoofdnavigatie"></nav></div>
<script>
const icons={Home:'⌂',Evenementen:'▦',Inventaris:'▣',Voorbereiding:'☑',Meer:'•••'};
const tasks=['Paklijst workshop afronden','Ingrediënten inkopen','Opstelling controleren'];
let current='Home';let done=new Set();
const main=document.getElementById('main'),nav=document.querySelector('.bottom-nav');
function render(){document.getElementById('page-title').textContent=current==='Home'?'Dashboard':current;nav.innerHTML=Object.keys(icons).map(name=>'<button data-tab="'+name+'" class="'+(current===name?'active':'')+'"><span style="font-size:26px;line-height:25px">'+icons[name]+'</span><span>'+name+'</span></button>').join('');
if(current!=='Home'){main.innerHTML='<section class="placeholder card"><h2>'+current+'</h2><p>Deze module bouwen we in de volgende fase.</p></section>';return}
main.innerHTML='<section class="event card"><button class="section-title" id="next-event">Volgend evenement <span>›</span></button><div class="event-content"><div class="event-image" role="img" aria-label="Cocktail">🍸</div><div class="event-info"><h2>Cocktailworkshop</h2><div class="detail">▦ &nbsp; Za 15 feb</div><div class="detail">⌖ &nbsp; Utrecht</div><div class="detail">♙ &nbsp; 20 gasten</div><div class="progress-line"><div class="track"><span></span></div><strong>75%</strong></div><span class="status">In voorbereiding</span></div></div></section><section class="tasks"><div class="tasks-heading"><h2>Openstaande taken</h2><span class="count">'+(tasks.length-done.size)+'</span></div><div class="task-list card">'+tasks.map((task,i)=>'<label class="task"><input type="checkbox" data-task="'+i+'" '+(done.has(i)?'checked':'')+'><span class="'+(done.has(i)?'completed':'')+'">'+task+'</span><span>›</span></label>').join('')+'</div></section><button class="new-event" id="new-event"><span style="font-size:26px">＋</span> Nieuw evenement</button>';
document.getElementById('next-event').onclick=()=>{current='Evenementen';render()};
document.querySelectorAll('[data-task]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.task);done.has(i)?done.delete(i):done.add(i);render()});
document.getElementById('new-event').onclick=()=>{const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>Nieuw evenement</h2><p>Evenementen aanmaken wordt in de volgende fase toegevoegd.</p><button>Sluiten</button></div>';document.body.append(o);o.querySelector('button').onclick=()=>o.remove()};
}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){current=b.dataset.tab;render()}});
render();
</script></body></html>
