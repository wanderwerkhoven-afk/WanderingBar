name: Event detail build
on:
  push:
    branches: [main, feature/event-detail-dashboard]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm install
      - name: Prepare iPhone app icons
        run: |
          cp F84641DF-7011-4AD4-8662-96A0AABA3DAC.png public/apple-touch-icon.png
          cp F84641DF-7011-4AD4-8662-96A0AABA3DAC.png public/app-icon.png
      - run: npm run build
